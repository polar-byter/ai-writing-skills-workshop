name: Проверка курса

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - name: Получить материалы
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Подготовить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Проверить страницы, архивы, скиллы и скрипты проверки
        run: python tools/check_course.py
